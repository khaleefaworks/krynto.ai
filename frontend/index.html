<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicons & app icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Theme color: blue brand on light, dark bg on dark mode -->
  <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">

  <!-- Viewport: viewport-fit=cover extends into notch/Dynamic Island areas on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChatAssist">

  <!-- Android / generic PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="ChatAssist">

  <!-- Windows tile -->
  <meta name="msapplication-TileColor" content="#3b82f6">

  <title>AI ChatAssist - Agent Dashboard</title>
</head>

<body>
  <div id="root"></div>
  <!-- Capture beforeinstallprompt before React mounts — the event fires early and is missed by useEffect -->
  <script>
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
      window.dispatchEvent(new Event('pwainstallready'));
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
