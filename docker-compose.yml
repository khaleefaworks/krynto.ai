services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chatassist
      POSTGRES_USER: chatassist
      POSTGRES_PASSWORD: chatassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://chatassist:chatassist@db:5432/chatassist
      ENV: production
      SECRET_KEY: "change-me-in-prod"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      PUBLIC_BASE_URL: "http://localhost:8000"
      RATE_LIMIT_ENABLED: "true"
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: "http://localhost:8000"
        VITE_WS_BASE: "ws://localhost:8000"
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
