# Nginx vhost template for the Agent Dashboard (Vite build output)
#
# Expected:
# - Build output at: /var/www/aichatassist-dashboard
# - API served separately (e.g., https://api.example.com)

server {
  listen 80;
  server_name dashboard.example.com;

  root /var/www/aichatassist-dashboard;
  index index.html;

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: long cache for hashed assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
