# Nginx vhost template for the backend API (including WebSockets)
#
# Expected:
# - Backend listens on 127.0.0.1:8000
# - TLS termination handled elsewhere or via certbot includes

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream aichatassist_backend {
  server 127.0.0.1:8000;
}

server {
  listen 80;
  server_name api.example.com;

  # If you're terminating TLS in Nginx, add your cert config here.

  client_max_body_size 20m;

  location / {
    proxy_pass http://aichatassist_backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (covers /ws/chat/*, /ws/agent/*, /ws/presence/*)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }
}
