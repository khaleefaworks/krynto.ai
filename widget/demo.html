<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ChatAssist | Demo</title>
    <link rel="icon" href="https://noveloffice.in/wp-content/uploads/2023/08/cropped-novel-favicon-192x192.webp"
        sizes="192x192">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@99,700&amp;display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        :root {
            --background-color-light: hsla(230, 80%, 98%, 1);
            --toggle-light: hsla(230, 25%, 10%, 1);
            --line-light: hsla(230, 35%, 92.5%, 1);
            --dot-light: hsla(230, 25%, 75%, 1);
            --text-top-light: hsla(240, 25%, 10%, 1);
            --text-bottom-light: hsla(240, 25%, 25%, 1);
            --text-circle-light: hsla(240, 25%, 25%, 1);

            --background-color-dark: hsla(230, 55%, 4%, 1);
            --toggle-dark: hsla(230, 25%, 75%, 1);
            --line-dark: hsla(230, 25%, 15%, 0.75);
            --dot-dark: hsla(230, 25%, 90%, 1);
            --text-top-dark: hsla(240, 60%, 90%, 1);
            --text-bottom-dark: hsla(240, 60%, 95%, 1);
            --text-circle-dark: hsla(240, 60%, 95%, 0.15);

            color-scheme: light;

            --x: 50%;
            --y: 50%;
        }

        html {
            --background-color: var(--background-color-light);
            --toggle-color: var(--toggle-light);
            --line-color: var(--line-light);
            --dot-color: var(--dot-light);
            --text-color-top: var(--text-top-light);
            --text-color-bottom: var(--text-bottom-light);
            --text-color-circle: var(--text-circle-light);
        }

        html.dark {
            color-scheme: dark;

            --background-color: var(--background-color-dark);
            --toggle-color: var(--toggle-dark);
            --line-color: var(--line-dark);
            --dot-color: var(--dot-dark);
            --text-color-top: var(--text-top-dark);
            --text-color-bottom: var(--text-bottom-dark);
            --text-color-circle: var(--text-circle-dark);
        }

        body {
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Instrument Sans", sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-color: var(--background-color);
        }

        main {
            width: 100%;
        }

        section {
            width: clamp(360px, 60vw, 780px);
            aspect-ratio: 1.55 / 0.5;
            min-height: 200px;
            margin: auto;
            text-align: center;
            place-items: center;
            display: grid;
            position: relative;

            .dot {
                height: 5px;
                width: 5px;
                background-color: var(--dot-color);
                position: absolute;
                z-index: 1;
                border-radius: 50%;
                box-shadow: 0 0 0 3px var(--background-color);

                &:nth-child(1) {
                    top: -2px;
                    left: -2px;
                }

                &:nth-child(2) {
                    top: -2px;
                    right: -2px;
                }

                &:nth-child(3) {
                    bottom: -2px;
                    right: -2px;
                }

                &:nth-child(4) {
                    bottom: -2px;
                    left: -2px;
                }
            }

            &:before,
            &:after {
                content: "";
                position: absolute;
                height: 100dvh;
                width: 1px;
                background-color: var(--line-color);
            }

            &:before {
                left: 0;
            }

            &:after {
                right: 0;
            }
        }

        main hr {
            border: none;
            height: 1px;
            width: 100%;
            margin: 0;
            background-color: var(--line-color);
        }

        h1 {
            font-optical-sizing: auto;
            font-weight: 700;
            font-style: normal;
            font-variation-settings: "wdth" 95;
            font-size: clamp(32px, 6vw, 68px);
            line-height: 1.05;
            margin: 0;
            text-align: left;
        }

        h1 span {
            background-image: linear-gradient(180deg,
                    var(--text-color-top) 0%,
                    var(--text-color-bottom) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 strong {
            display: inline-block;
            color: transparent;
            background-image: url("https://assets.codepen.io/165585/circle-bg_1.svg");
            background-color: var(--text-color-circle);
            background-size: 400px;
            background-position: 50% 80%;
            background-blend-mode: overlay;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.015em;
        }

        @keyframes reveal-in {
            from {
                clip-path: circle(0% at var(--x) var(--y));
            }

            to {
                clip-path: circle(150% at var(--x) var(--y));
            }
        }

        @keyframes reveal-out {
            from {
                clip-path: circle(150% at var(--x) var(--y));
            }

            to {
                clip-path: circle(0% at var(--x) var(--y));
            }
        }

        ::view-transition-new(root) {
            animation: reveal-in 0.5s ease-in-out forwards;
            z-index: 1;
            mix-blend-mode: normal;
        }

        ::view-transition-old(root) {
            animation: reveal-out 0.5s ease-in-out forwards;
            animation-delay: 0.5s;
            z-index: 0;
            mix-blend-mode: normal;
        }

        ::view-transition-image-pair(root) {
            isolation: isolate;
        }

        .toggle {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) scale(0.5);
            cursor: pointer;
            z-index: 10;
        }

        .toggle input {
            display: none;
        }

        .toggle input+div {
            border-radius: 50%;
            width: 36px;
            height: 36px;
            position: relative;
            box-shadow: inset 16px -16px 0 0 var(--toggle-color);
            transform: scale(1) rotate(-2deg);
            transition: box-shadow 0.5s ease 0s, transform 0.4s ease 0.1s;
        }

        .toggle input+div:before {
            content: "";
            width: inherit;
            height: inherit;
            border-radius: inherit;
            position: absolute;
            left: 0;
            top: 0;
            background: light-dark(transparent, var(--toggle-color));
            transition: background 0.3s ease;
        }

        .toggle input+div:after {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin: -4px 0 0 -4px;
            position: absolute;
            top: 50%;
            left: 50%;
            box-shadow: 0 -23px 0 var(--toggle-color), 0 23px 0 var(--toggle-color),
                23px 0 0 var(--toggle-color), -23px 0 0 var(--toggle-color),
                15px 15px 0 var(--toggle-color), -15px 15px 0 var(--toggle-color),
                15px -15px 0 var(--toggle-color), -15px -15px 0 var(--toggle-color);
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .toggle input:checked+div {
            box-shadow: inset 32px -32px 0 0 var(--background-color);
            transform: scale(0.5) rotate(0deg);
            transition: transform 0.3s ease 0.1s, box-shadow 0.2s ease 0s;
        }

        .toggle input:checked+div:before {
            background: var(--toggle-color);
            transition: background 0.3s ease 0.1s;
        }

        .toggle input:checked+div:after {
            transform: scale(1.5);
            transition: transform 0.5s ease 0.15s;
        }

        /* --- Widget Key UI --- */
        #demo-key-btn {
            position: fixed;
            top: 12px;
            right: 16px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px 5px 8px;
            border-radius: 20px;
            border: 1px solid var(--line-color);
            background: var(--background-color);
            color: var(--text-color-bottom);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        #demo-key-btn:hover {
            border-color: var(--dot-color);
        }

        #demo-key-btn svg {
            flex-shrink: 0;
            opacity: 0.6;
        }

        #demo-key-btn .demo-key-label {
            font-weight: 600;
            opacity: 0.5;
            letter-spacing: 0.02em;
        }

        #demo-key-btn .demo-key-val {
            font-family: monospace;
            font-size: 11px;
            opacity: 0.75;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* --- Key Modal --- */
        #demo-key-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
        }

        #demo-key-modal.open {
            display: flex;
        }

        #demo-key-box {
            background: var(--background-color);
            border-radius: 16px;
            padding: 32px 28px 24px;
            width: clamp(300px, 90vw, 440px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #demo-key-box h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color-top);
        }

        #demo-key-box p {
            margin: 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-color-bottom);
            opacity: 0.8;
        }

        #demo-key-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--line-color);
            background: var(--background-color);
            color: var(--text-color-top);
            font-family: monospace;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        #demo-key-input:focus {
            border-color: var(--dot-color);
        }

        #demo-key-input.error {
            border-color: #ef4444;
        }

        .demo-key-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .demo-key-actions button {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .demo-key-actions button:hover {
            opacity: 0.85;
        }

        #demo-key-cancel {
            background: var(--line-color);
            color: var(--text-color-bottom);
        }

        #demo-key-save {
            background: #3b82f6;
            color: #fff;
        }

        #demo-key-error {
            font-size: 12px;
            color: #ef4444;
            display: none;
        }
    </style>
</head>

<body>

    <!-- Dark/light toggle -->
    <label class="toggle">
        <input type="checkbox" />
        <div></div>
    </label>

    <!-- Widget key indicator & change button -->
    <button id="demo-key-btn" title="Change widget key">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.5" cy="15.5" r="5.5" />
            <path d="M21 2l-9.6 9.6" />
            <path d="M15.5 7.5l3 3L21 2z" />
        </svg>
        <span class="demo-key-label">KEY</span>
        <span class="demo-key-val" id="demo-key-display">not set</span>
    </button>

    <!-- Widget key modal -->
    <div id="demo-key-modal">
        <div id="demo-key-box">
            <h2>Widget Key</h2>
            <p>Enter the widget key from your dashboard (<strong>Settings → Websites → Widget tab</strong>). It will be
                saved in localStorage so you won't need to set it again.</p>
            <input id="demo-key-input" type="text" placeholder="Paste your widget key here…" autocomplete="off"
                spellcheck="false" />
            <span id="demo-key-error">Please enter a valid widget key.</span>
            <div class="demo-key-actions">
                <button id="demo-key-cancel">Cancel</button>
                <button id="demo-key-save">Save &amp; Reload</button>
            </div>
        </div>
    </div>

    <main>
        <hr />

        <section>

            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>

            <h1><span>AI.</span><br /><strong>ChatAssist</strong> <span>.</span></h1>

        </section>

        <hr />
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleInput = document.querySelector('.toggle input');
            const rootElement = document.documentElement;

            const applyTheme = (isDark) => {
                if (isDark) {
                    rootElement.classList.add('dark');
                } else {
                    rootElement.classList.remove('dark');
                }
            };

            const stored = localStorage.getItem('demo_dark_mode');
            const prefersDark = stored !== null ? stored === 'true' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            toggleInput.checked = prefersDark;
            applyTheme(prefersDark);

            toggleInput.addEventListener('input', (event) => {
                const isDark = toggleInput.checked;
                localStorage.setItem('demo_dark_mode', isDark);

                let x = window.innerWidth / 2;
                let y = window.innerHeight / 2;

                const toggleElement = document.querySelector('.toggle');

                if (toggleElement) {
                    const rect = toggleElement.getBoundingClientRect();
                    x = rect.left + rect.width / 2;
                    y = rect.top + rect.height / 2;
                }

                if (!document.startViewTransition) {
                    console.warn("View Transition API not supported. Falling back.");
                    applyTheme(isDark);
                    return;
                }

                const transition = document.startViewTransition(() => {
                    applyTheme(isDark);
                });

                transition.ready.then(() => {
                    rootElement.style.setProperty('--x', `${x}px`);
                    rootElement.style.setProperty('--y', `${y}px`);
                }).catch(error => {
                    console.error("Error during View Transition setup:", error);
                });

                transition.finished.then(() => {
                    console.log("Transition finished."); // Debug log
                }).catch(error => {
                    console.error("Error during View Transition finish:", error);
                });

            });

        });
    </script>

    <!-- AI ChatAssist Live Chat — key loaded from localStorage -->
    <script>
        (function () {
            var STORAGE_KEY = 'demo_widget_key';
            var modal = document.getElementById('demo-key-modal');
            var input = document.getElementById('demo-key-input');
            var saveBtn = document.getElementById('demo-key-save');
            var cancelBtn = document.getElementById('demo-key-cancel');
            var errorEl = document.getElementById('demo-key-error');
            var keyBtn = document.getElementById('demo-key-btn');
            var keyDisplay = document.getElementById('demo-key-display');

            function getKey() {
                return localStorage.getItem(STORAGE_KEY) || '';
            }

            function updateKeyDisplay(key) {
                if (key) {
                    keyDisplay.textContent = key.slice(0, 8) + '…' + key.slice(-4);
                } else {
                    keyDisplay.textContent = 'not set';
                }
            }

            function loadWidget(key) {
                var _aichatassist = window._aichatassist || {};
                _aichatassist.key = key;
                window._aichatassist = _aichatassist;
                if (!window.aichatassist) {
                    var o = window.aichatassist = function () { o._.push(arguments); };
                    o._ = [];
                }
                var s = document.getElementsByTagName('script')[0];
                var c = document.createElement('script');
                c.type = 'text/javascript';
                c.charset = 'utf-8';
                c.async = true;
                c.referrerPolicy = 'origin';
                c.src = 'http://localhost:8000/widget/loader.js?key=' + encodeURIComponent(key);
                s.parentNode.insertBefore(c, s);
            }

            function openModal() {
                input.value = getKey();
                errorEl.style.display = 'none';
                input.classList.remove('error');
                modal.classList.add('open');
                setTimeout(function () { input.focus(); input.select(); }, 50);
            }

            function closeModal() {
                modal.classList.remove('open');
            }

            function saveKey() {
                var key = input.value.trim();
                if (!key) {
                    input.classList.add('error');
                    errorEl.style.display = 'block';
                    input.focus();
                    return;
                }
                localStorage.setItem(STORAGE_KEY, key);
                window.location.reload();
            }

            // Modal controls
            saveBtn.addEventListener('click', saveKey);
            cancelBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', function (e) {
                if (e.target === modal) closeModal();
            });
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') saveKey();
                if (e.key === 'Escape') closeModal();
                input.classList.remove('error');
                errorEl.style.display = 'none';
            });

            // Change key button
            keyBtn.addEventListener('click', openModal);

            // Boot: load widget or prompt
            var storedKey = getKey();
            updateKeyDisplay(storedKey);
            if (storedKey) {
                loadWidget(storedKey);
            } else {
                // No key yet — open modal automatically
                modal.classList.add('open');
                setTimeout(function () { input.focus(); }, 100);
            }
        })();
    </script>
    <noscript> Powered by <a href="#" target="_blank">AI ChatAssist</a></noscript>
</body>

</html>
